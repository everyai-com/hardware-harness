name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only checks out and builds.
permissions:
  contents: read

jobs:
  harness:
    name: Harness — tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install
        working-directory: harness
        run: npm ci

      - name: Test (gates, cost model, MCP transport)
        working-directory: harness
        run: npm test

      - name: Typecheck
        working-directory: harness
        run: npm run check

      - name: Audit production dependencies
        working-directory: harness
        run: npm audit --omit=dev --audit-level=high

      - name: Score the benchmark fixtures
        working-directory: harness
        run: node src/index.ts

  web:
    name: Web — bundle parity, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --include=dev

      - name: Verify bundled engine scores identically to the CLI
        working-directory: web
        run: npm run harness:verify

      - name: Test (request parsing, rate-limit keys, slugs, kit zip, spec schema)
        working-directory: web
        run: npm test

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build
